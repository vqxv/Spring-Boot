<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>用户管理</title>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">安全演示系统</a>
        <div class="d-flex ms-auto align-items-center">
            <a class="btn btn-outline-light ms-2" href="/admin/home">返回主页</a>
            <a class="btn btn-outline-light ms-2" href="/">首页</a>
            <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 10px;">
                <button type="submit" class="btn btn-outline-light">注销</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>用户管理</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">添加用户</button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>角色</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td>
                    <span th:class="${user.role == 'ROLE_ADMIN'} ? 'badge bg-danger' : 'badge bg-success'" 
                          th:text="${user.role == 'ROLE_ADMIN'} ? '管理员' : '普通用户'"></span>
                </td>
                <td>
                    <button class="btn btn-sm btn-warning me-1" 
                            th:data-id="${user.id}" 
                            th:data-username="${user.username}" 
                            th:data-role="${user.role}"
                            onclick="editUser(this.dataset.id, this.dataset.username, this.dataset.role)">
                        编辑
                    </button>
                    <button class="btn btn-sm btn-danger" 
                            th:if="${user.username != currentUsername}"
                            th:data-id="${user.id}" 
                            th:data-username="${user.username}"
                            onclick="deleteUser(this.dataset.id, this.dataset.username)">
                        删除
                    </button>
                    <span th:if="${user.username == currentUsername}" class="text-muted small">(当前用户)</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- 添加用户模态框 -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addUserForm" onsubmit="return handleAddUser(event)">
                <div class="modal-header">
                    <h5>添加用户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="addUsername" class="form-control mb-2" placeholder="用户名" required>
                    <input type="password" id="addPassword" class="form-control mb-2" placeholder="密码" required>
                    <select id="addRole" class="form-select">
                        <option value="ROLE_USER">普通用户</option>
                        <option value="ROLE_ADMIN">管理员</option>
                    </select>
                    <div id="addUserError" class="alert alert-danger mt-2" style="display:none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 编辑用户模态框 -->
<div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editUserForm" onsubmit="return handleEditUser(event)">
                <div class="modal-header">
                    <h5>编辑用户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editUserId">
                    <input type="text" id="editUsername" class="form-control mb-2" placeholder="用户名" required>
                    <select id="editRole" class="form-select mb-2">
                        <option value="ROLE_USER">普通用户</option>
                        <option value="ROLE_ADMIN">管理员</option>
                    </select>
                    <input type="password" id="editPassword" class="form-control" placeholder="新密码（留空不修改）">
                    <div id="editUserError" class="alert alert-danger mt-2" style="display:none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-warning">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
// 获取CSRF token
function getCsrfToken() {
    return document.querySelector('meta[name="_csrf"]')?.content || '';
}

function getCsrfHeader() {
    return document.querySelector('meta[name="_csrf_header"]')?.content || '';
}

// 添加用户
function handleAddUser(event) {
    event.preventDefault();
    var username = document.getElementById('addUsername').value;
    var password = document.getElementById('addPassword').value;
    var role = document.getElementById('addRole').value;
    var errorDiv = document.getElementById('addUserError');
    
    fetch('/admin/users/add', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            [getCsrfHeader()]: getCsrfToken()
        },
        body: 'username=' + encodeURIComponent(username) + 
              '&password=' + encodeURIComponent(password) + 
              '&role=' + encodeURIComponent(role)
    })
    .then(response => response.text())
    .then(result => {
        if (result === 'success') {
            window.location.reload();
        } else {
            errorDiv.textContent = result;
            errorDiv.style.display = 'block';
        }
    });
    return false;
}

// 编辑用户
function editUser(id, username, role) {
    document.getElementById('editUserId').value = id;
    document.getElementById('editUsername').value = username;
    document.getElementById('editRole').value = role;
    document.getElementById('editPassword').value = '';
    document.getElementById('editUserError').style.display = 'none';
    new bootstrap.Modal(document.getElementById('editUserModal')).show();
}

function handleEditUser(event) {
    event.preventDefault();
    var id = document.getElementById('editUserId').value;
    var username = document.getElementById('editUsername').value;
    var role = document.getElementById('editRole').value;
    var password = document.getElementById('editPassword').value;
    var errorDiv = document.getElementById('editUserError');
    
    fetch('/admin/users/update/' + id, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            [getCsrfHeader()]: getCsrfToken()
        },
        body: JSON.stringify({
            username: username,
            role: role,
            password: password
        })
    })
    .then(response => response.text())
    .then(result => {
        if (result === 'success') {
            window.location.reload();
        } else {
            errorDiv.textContent = result;
            errorDiv.style.display = 'block';
        }
    });
    return false;
}

// 删除用户
function deleteUser(id, username) {
    if (!confirm('确定要删除用户 "' + username + '" 吗？')) {
        return;
    }
    
    fetch('/admin/users/delete/' + id, {
        method: 'POST',
        headers: {
            [getCsrfHeader()]: getCsrfToken()
        }
    })
    .then(response => response.text())
    .then(result => {
        if (result === 'success') {
            window.location.reload();
        } else {
            alert(result);
        }
    });
}
</script>
</body>
</html>
