<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>管理员</title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">安全演示系统</a>
        <div class="d-flex ms-auto align-items-center">
            <a class="nav-link active" href="/admin/home">管理员页面</a>
            <a class="nav-link" href="/user/home">用户页面</a>
            <a class="btn btn-outline-light ms-2" href="/admin/users">用户管理</a>
            <a class="btn btn-outline-light ms-2" href="/">首页</a>
            <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 10px;">
                <button type="submit" class="btn btn-outline-light">注销</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1>管理员主页</h1>
    <p>欢迎，<span th:text="${username}"></span></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
