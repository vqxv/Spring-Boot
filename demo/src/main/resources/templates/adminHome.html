<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>管理员主页</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0-alpha1/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">管理面板</a>
    <div class="ms-auto">
            <span class="navbar-text text-white">
                管理员，<span th:text="${username}">admin</span>
            </span>
      <a href="/login" class="btn btn-outline-light btn-sm ms-3">注销</a>
    </div>
  </div>
</nav>
<div class="container mt-5">
  <div class="alert alert-success">
    <h4>管理员专区</h4>
    <p>只有 <code>ROLE_ADMIN</code> 权限的用户才能访问此页面。管理员可以执行系统维护、数据管理等操作。</p>
  </div>
  <a href="/user/home" class="btn btn-primary">访问用户页面</a>
  <a href="/" class="btn btn-primary">返回首页</a>
</div>
</body>
</html>
